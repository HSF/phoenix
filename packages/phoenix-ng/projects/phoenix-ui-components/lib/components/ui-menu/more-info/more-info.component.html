<div class="hidden-panels">
  <app-info-panel #infoPanel *ngIf="uiConfig?.showInfoPanel"></app-info-panel>
  <app-eta-phi-panel
    #etaPhiPanel
    *ngIf="uiConfig?.showEtaPhiPanel"
  ></app-eta-phi-panel>
  <app-kinematics-panel
    #kinematicsPanel
    *ngIf="uiConfig?.showKinematicsPanel"
    [config]="kinematicsConfig"
  ></app-kinematics-panel>
</div>

<mat-menu #moreInfo>
  <button mat-menu-item *ngIf="uiConfig?.showInfoPanel">
    <mat-checkbox
      [checked]="showInfoPanel"
      (click)="$event.stopPropagation()"
      (change)="toggleInfoPanel()"
    >
      <span class="item-content">
        <svg class="item-icon">
          <use href="assets/icons/info-panel.svg#info-panel"></use>
        </svg>
        Info Panel
      </span>
    </mat-checkbox>
  </button>
  <button mat-menu-item *ngIf="uiConfig?.showEtaPhiPanel">
    <mat-checkbox
      [checked]="showEtaPhiPanel"
      (click)="$event.stopPropagation()"
      (change)="toggleEtaPhiPanel()"
    >
      <span class="item-content">
        <svg class="item-icon">
          <use href="assets/icons/eta-phi.svg#eta-phi"></use>
        </svg>
        Eta-Phi Panel
      </span>
    </mat-checkbox>
  </button>
  <button mat-menu-item *ngIf="uiConfig?.showKinematicsPanel">
    <mat-checkbox
      [checked]="showKinematicsPanel"
      (click)="$event.stopPropagation()"
      (change)="toggleKinematicsPanel()"
    >
      <span class="item-content">
        <svg class="item-icon">
          <use href="assets/icons/kinematics.svg#kinematics"></use>
        </svg>
        Track Kinematics
      </span>
    </mat-checkbox>
  </button>
</mat-menu>

<app-menu-toggle
  [matMenuTriggerFor]="moreInfo"
  tooltip="More information"
  icon="info"
  [active]="false"
>
</app-menu-toggle>
